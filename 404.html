<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Naitik Grover (codenaitik)</title>
    <script>
      sessionStorage.redirect = location.href;
      var l = window.location;
      if (l.pathname.startsWith('/portfolio')) {
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/portfolio/');
      } else {
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/');
      }
    </script>
  </head>

</html>
